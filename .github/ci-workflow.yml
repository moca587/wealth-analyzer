# ─────────────────────────────────────────────────────────────────────────────
# TO ACTIVATE: move this file to .github/workflows/ci.yml
#   git mv .github/ci-workflow.yml .github/workflows/ci.yml
# It lives here (not under workflows/) because the token used to push it lacks
# GitHub's `workflow` scope. Move it via the GitHub web UI, or from a machine
# whose token/SSH key has `workflow` scope, to register it as an Actions run.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wealth-app-next/package-lock.json

      # ── wealth-app-next (Next.js/Supabase SaaS) ──
      - name: Install app dependencies
        run: npm --prefix wealth-app-next ci

      - name: Unit tests
        run: npm run app:test

      - name: Type-check
        run: npm run app:typecheck

      - name: Build (Next.js)
        run: npm run app:build
        env:
          # The build doesn't hit Supabase, but the client is constructed at
          # module load in a few places — provide harmless placeholders so a
          # missing-env edge case can never fail the build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # ── Legacy single-file HTML artifacts ──
      # Validation only (no rebuild): confirms the committed standalone files
      # are self-contained and their APP_VERSION matches their version file and
      # source. Catches the drift class that caused the live auto-reload loop.
      - name: Validate legacy artifacts
        run: npm run legacy:check
