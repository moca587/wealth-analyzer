# Dev-only stand-in for Supabase's Kong gateway: one origin, two routes.
# Not for production — no rate limiting, no key checks (PostgREST/GoTrue still
# verify the JWT themselves).
server {
  listen 8000;

  # The browser (localhost:3000) calls this origin (localhost:54321).
  add_header Access-Control-Allow-Origin  "$http_origin" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, accept-profile, content-profile, range" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, content-location" always;
  add_header Vary "Origin" always;

  if ($request_method = OPTIONS) { return 204; }

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }
}
